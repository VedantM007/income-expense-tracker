<div class="flex h-full">
  <!-- Sidebar -->
  <div
    id="sidebar"
    [ngClass]="{'-translate-x-full': !isSidebarOpen, 'translate-x-0': isSidebarOpen}"
    class="sidebar-glass w-full sm:w-64 space-y-6 px-4 py-6 fixed inset-y-0 left-0 transform transition-transform duration-300 ease-in-out md:translate-x-0 md:block xs:w-40 z-40"
  >
    <!-- Logo Section -->
    <div class="flex items-center w-full p-3 glass-card bg-white/20 dark:bg-white/5 border border-white/20 dark:border-white/5 rounded-xl">
      <img
        src="../../../assets/images/image.png"
        alt="logo"
        class="w-10 h-10 rounded-full border border-slate-200 dark:border-slate-800"
      />
      <span class="ml-3 text-slate-900 dark:text-slate-100 font-bold text-sm sm:text-xs">
        Tracker App
      </span>
    </div>

    <!-- Navigation -->
    <nav class="mt-8 space-y-2">
      <a
        routerLink="/dashboard"
        routerLinkActive="active"
        class="flex items-center py-3 px-4 cursor-pointer rounded-xl text-slate-700 dark:text-slate-300 hover:bg-slate-200/40 dark:hover:bg-slate-800/40 hover:text-slate-900 dark:hover:text-slate-100 transition-all duration-200"
      >
        <svg
          xmlns="http://www.w3.org/2000/svg"
          class="h-5 w-5 mr-3"
          fill="none"
          viewBox="0 0 24 24"
          stroke="currentColor"
          stroke-width="2"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            d="M3 3h7v7H3V3zm0 11h7v7H3v-7zm11-11h7v7h-7V3zm0 11h7v7h-7v-7z"
          />
        </svg>
        <span>Dashboard</span>
      </a>
      
      <a
        routerLink="/income"
        routerLinkActive="active"
        class="flex items-center py-3 px-4 cursor-pointer rounded-xl text-slate-700 dark:text-slate-300 hover:bg-slate-200/40 dark:hover:bg-slate-800/40 hover:text-slate-900 dark:hover:text-slate-100 transition-all duration-200"
      >
        <svg
          xmlns="http://www.w3.org/2000/svg"
          fill="none"
          viewBox="0 0 24 24"
          stroke-width="1.5"
          stroke="currentColor"
          class="size-5 mr-3"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            d="M2.25 18 9 11.25l4.306 4.306a11.95 11.95 0 0 1 5.814-5.518l2.74-1.22m0 0-5.94-2.281m5.94 2.28-2.28 5.941"
          />
        </svg>
        <span>Income</span>
      </a>
      
      <a
        routerLink="/expense"
        routerLinkActive="active"
        class="flex items-center py-3 px-4 cursor-pointer rounded-xl text-slate-700 dark:text-slate-300 hover:bg-slate-200/40 dark:hover:bg-slate-800/40 hover:text-slate-900 dark:hover:text-slate-100 transition-all duration-200"
      >
        <svg
          xmlns="http://www.w3.org/2000/svg"
          fill="none"
          viewBox="0 0 24 24"
          stroke-width="1.5"
          stroke="currentColor"
          class="size-5 mr-3"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            d="M2.25 6 9 12.75l4.286-4.286a11.948 11.948 0 0 1 4.306 6.43l.776 2.898m0 0 3.182-5.511m-3.182 5.51-5.511-3.181"
          />
        </svg>
        <span>Expense</span>
      </a>
    </nav>
  </div>
</div>
