<div class="flex justify-center items-center min-h-screen px-4 py-12">
  <div class="w-full max-w-md glass-card p-8 sm:p-10 flex flex-col items-center">
    
    <!-- Logo & Title Header -->
    <div class="flex flex-col items-center text-center mb-8">
      <div class="w-16 h-16 bg-white dark:bg-slate-800 rounded-2xl shadow-sm flex items-center justify-center border border-slate-100 dark:border-slate-700/50 p-2.5 mb-4 transition-transform duration-300 hover:scale-105">
        <img
          src="../../../assets/images/image.png"
          alt="logo"
          class="w-full h-full object-contain rounded-lg"
        />
      </div>
      <h2 class="text-2xl font-bold text-slate-900 dark:text-slate-100 tracking-tight">
        Income and Expense Tracker
      </h2>
      <p class="text-sm text-slate-500 dark:text-slate-400 mt-2">
        Welcome back! Please sign in to continue.
      </p>
    </div>

    <!-- Form -->
    <form [formGroup]="myForm" (ngSubmit)="onSave()" class="w-full space-y-6">
      
      <!-- Email Input -->
      <div>
        <div class="relative">
          <span class="absolute inset-y-0 left-0 flex items-center pl-3.5 pointer-events-none text-slate-400 dark:text-slate-500">
            <!-- Envelope SVG -->
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-5 h-5">
              <path stroke-linecap="round" stroke-linejoin="round" d="M21.75 6.75v10.5a2.25 2.25 0 0 1-2.25 2.25h-15a2.25 2.25 0 0 1-2.25-2.25V6.75m19.5 0A2.25 2.25 0 0 0 19.5 4.5h-15a2.25 2.25 0 0 0-2.25 2.25m19.5 0v.243a2.25 2.25 0 0 1-1.07 1.916l-7.5 4.615a2.25 2.25 0 0 1-2.36 0L3.32 8.91a2.25 2.25 0 0 1-1.07-1.916V6.75" />
            </svg>
          </span>
          <input
            id="email"
            type="text"
            formControlName="email"
            placeholder="Email"
            [ngClass]="{
              'border-red-500 focus:ring-red-500/20': myForm.get('email')?.invalid && myForm.get('email')?.touched
            }"
            class="w-full pl-11 pr-4 py-3 glass-input text-sm"
          />
        </div>
        <div *ngIf="myForm.get('email')?.touched" class="mt-1.5 pl-1">
          <small
            *ngIf="myForm.get('email')?.hasError('required')"
            class="text-red-500 text-xs"
          >
            Email is required.
          </small>
          <small
            *ngIf="myForm.get('email')?.hasError('email')"
            class="text-red-500 text-xs"
          >
            Please enter a valid email address.
          </small>
        </div>
      </div>

      <!-- Password Input -->
      <div>
        <div class="relative">
          <span class="absolute inset-y-0 left-0 flex items-center pl-3.5 pointer-events-none text-slate-400 dark:text-slate-500">
            <!-- Lock SVG -->
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-5 h-5">
              <path stroke-linecap="round" stroke-linejoin="round" d="M16.5 10.5V6.75a4.5 4.5 0 1 0-9 0v3.75m-.75 11.25h10.5a2.25 2.25 0 0 0 2.25-2.25v-6.75a2.25 2.25 0 0 0-2.25-2.25H6.75a2.25 2.25 0 0 0-2.25 2.25v6.75a2.25 2.25 0 0 0 2.25 2.25Z" />
            </svg>
          </span>
          <input
            id="password"
            [type]="showPassword ? 'text' : 'password'"
            formControlName="password"
            placeholder="Password"
            [ngClass]="{
              'border-red-500 focus:ring-red-500/20': myForm.get('password')?.invalid && myForm.get('password')?.touched
            }"
            class="w-full pl-11 pr-12 py-3 glass-input text-sm"
          />
          <button
            type="button"
            (click)="togglePasswordVisibility()"
            class="absolute inset-y-0 right-0 flex items-center pr-3.5 text-slate-400 hover:text-slate-600 dark:hover:text-slate-200 transition-colors"
          >
            <!-- Eye/Crossed Eye Icon -->
            <svg *ngIf="!showPassword" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-5 h-5">
              <path stroke-linecap="round" stroke-linejoin="round" d="M2.036 12.322a1.012 1.012 0 0 1 0-.639C3.423 7.51 7.36 4.5 12 4.5c4.638 0 8.573 3.007 9.963 7.178.07.207.07.431 0 .639C20.577 16.49 16.64 19.5 12 19.5c-4.638 0-8.573-3.007-9.963-7.178Z" />
              <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 1 1-6 0 3 3 0 0 1 6 0Z" />
            </svg>
            <svg *ngIf="showPassword" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-5 h-5">
              <path stroke-linecap="round" stroke-linejoin="round" d="M3.98 8.223A10.477 10.477 0 0 0 1.934 12C3.226 16.338 7.244 19.5 12 19.5c.993 0 1.953-.138 2.863-.395M6.228 6.228A10.451 10.451 0 0 1 12 4.5c4.756 0 8.773 3.162 10.065 7.498a10.522 10.522 0 0 1-4.293 5.774M6.228 6.228 3 3m3.228 3.228 3.65 3.65m7.894 7.894L21 21m-3.228-3.228-3.65-3.65m0 0a3 3 0 1 0-4.243-4.243m4.242 4.242L9.88 9.88" />
            </svg>
          </button>
        </div>
        <div *ngIf="myForm.get('password')?.invalid && myForm.get('password')?.touched" class="mt-1.5 pl-1">
          <small class="text-red-500 text-xs">Password is required.</small>
        </div>
      </div>

      <!-- Remember & Forgot Options -->
      <div class="flex items-center justify-end text-xs sm:text-sm">
        <a (click)="navigateToForgetPassword()" class="text-primary-color hover:underline cursor-pointer font-medium text-[#2563EB]">
          Forgot Password?
        </a>
      </div>

      <!-- Submit Button -->
      <button
        type="submit"
        [disabled]="myForm.invalid || isLoading"
        class="w-full py-3 btn-primary text-sm tracking-wide uppercase flex items-center justify-center gap-2"
      >
        <span
          *ngIf="isLoading"
          class="w-4 h-4 border-2 border-transparent border-t-white rounded-full animate-spin"
        ></span>
        Sign In
      </button>
    </form>

    <!-- Sign-Up Link -->
    <div class="mt-8 text-sm text-slate-500 dark:text-slate-400">
      Don't have an account?&nbsp;<a (click)="navigateToSignUp()" class="text-primary-color font-medium hover:underline cursor-pointer text-[#2563EB]">Sign up</a>
    </div>

    <!-- Footer -->
    <div class="mt-8 text-xs text-slate-400 dark:text-slate-500 text-center">
      {{ footerText }}
    </div>
  </div>
</div>
