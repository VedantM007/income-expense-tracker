<div class="flex justify-center items-center min-h-screen px-4 py-12">
  <div class="w-full max-w-md glass-card p-8 sm:p-10 flex flex-col items-center">
    
    <!-- Logo & Title Header -->
    <div class="flex flex-col items-center text-center mb-8">
      <div class="w-16 h-16 bg-white dark:bg-slate-800 rounded-2xl shadow-sm flex items-center justify-center border border-slate-100 dark:border-slate-700/50 p-2.5 mb-4 transition-transform duration-300 hover:scale-105">
        <img
          src="../../../assets/images/image.png"
          alt="logo"
          class="w-full h-full object-contain rounded-lg"
        />
      </div>
      <h2 class="text-2xl font-bold text-slate-900 dark:text-slate-100 tracking-tight">
        MFA Verification
      </h2>
      <p class="text-xs text-slate-500 dark:text-slate-400 mt-3 px-2 leading-relaxed">
        Enter the 6-digit OTP verification code sent to your email <strong class="text-slate-700 dark:text-slate-300 font-medium">{{email}}</strong> to sign in. The OTP is valid for 10 minutes.
      </p>
    </div>

    <!-- Form -->
    <form [formGroup]="myForm" (ngSubmit)="onSave()" class="w-full space-y-6">
      
      <!-- OTP Input -->
      <div>
        <div class="relative">
          <span class="absolute inset-y-0 left-0 flex items-center pl-3.5 pointer-events-none text-slate-400 dark:text-slate-500">
            <!-- Key SVG -->
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-5 h-5">
              <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 5.25a3 3 0 0 1 3 3m3 0a6 6 0 0 1-7.029 5.912c-.563-.097-1.159.026-1.563.43L10.5 17.25H8.25v2.25H6v2.25H2.25v-2.818c0-.597.237-1.17.659-1.591l6.499-6.499c.404-.404.527-1 .43-1.563A6 6 0 1 1 21.75 8.25Z" />
            </svg>
          </span>
          <input
            id="otp"
            type="text"
            maxlength="6"
            formControlName="otp"
            placeholder="Enter the OTP"
            [ngClass]="{
              'border-red-500 focus:ring-red-500/20': myForm.get('otp')?.invalid && myForm.get('otp')?.touched
            }"
            class="w-full pl-11 pr-4 py-3 glass-input text-sm tracking-[0.2em] font-semibold text-center placeholder:tracking-normal placeholder:font-normal"
            (keypress)="allowNumbersOnly($event)"
          />
        </div>
        <div *ngIf="myForm.get('otp')?.touched" class="mt-1.5 pl-1">
          <small
            *ngIf="myForm.get('otp')?.hasError('required')"
            class="text-red-500 text-xs"
          >
            OTP is required.
          </small>
          <small
            *ngIf="myForm.get('otp')?.hasError('minlength')"
            class="text-red-500 text-xs"
          >
            Please enter a valid OTP (Minimum 6 digits).
          </small>
          <small
            *ngIf="myForm.get('otp')?.hasError('pattern')"
            class="text-red-500 text-xs"
          >
            Only numbers are allowed.
          </small>
        </div>
      </div>

      <!-- Resend Timer -->
      <div class="flex justify-end text-xs text-slate-500 dark:text-slate-400">
        <a 
          (click)="resendOTP()" 
          [class.text-slate-400]="isDisabled" 
          [class.cursor-not-allowed]="isDisabled"
          [class.text-primary-color]="!isDisabled" 
          [class.hover:underline]="!isDisabled" 
          class="font-medium cursor-pointer"
        >
          Resend OTP
        </a>
        <span class="ml-1" *ngIf="isDisabled">&nbsp;in {{formattedTime}}</span>
      </div>

      <!-- Submit Button -->
      <button
        type="submit"
        [disabled]="myForm.invalid || isLoading"
        class="w-full py-3 btn-primary text-sm tracking-wide uppercase flex items-center justify-center gap-2"
      >
        <span
          *ngIf="isLoading"
          class="w-4 h-4 border-2 border-transparent border-t-white rounded-full animate-spin"
        ></span>
        Submit
      </button>
    </form>

    <!-- Footer -->
    <div class="mt-8 text-xs text-slate-400 dark:text-slate-500 text-center">
      {{ footerText }}
    </div>
  </div>
</div>
