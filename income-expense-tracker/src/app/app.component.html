<div class="fixed top-6 right-8 z-50" *ngIf="!show">
  <app-theme-toggle></app-theme-toggle>
</div>

<div class="flex h-screen overflow-hidden">
  <!-- Sidebar -->
  <app-sidebar
    *ngIf="show"
    [ngClass]="{
      'translate-x-0 md:-translate-x-full': isSidebarOpen,
      '-translate-x-full md:translate-x-0': !isSidebarOpen
    }"
    class="w-64 fixed inset-y-0 left-0 transform transition-transform duration-300 ease-in-out z-40"
  ></app-sidebar>

  <!-- Mobile Sidebar Backdrop -->
  <div 
    *ngIf="show && isSidebarOpen" 
    class="fixed inset-0 bg-slate-950/45 backdrop-blur-sm z-35 md:hidden transition-opacity duration-300"
    (click)="toggleSidebar()"
  ></div>

  <!-- Main Content -->
  <div
    [ngClass]="{
      'ml-0 md:ml-0': !show || isSidebarOpen,
      'ml-0 md:ml-64': show && !isSidebarOpen
    }"
    class="flex flex-col flex-grow transition-all duration-300"
  >
    <!-- Header -->
    <app-header *ngIf="show"></app-header>

    <!-- Router Outlet -->
    <main class="flex-grow p-6 overflow-y-auto">
      <router-outlet></router-outlet>
    </main>
  </div>
</div>
